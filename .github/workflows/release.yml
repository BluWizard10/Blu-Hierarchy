name: Build Release

on:
  workflow_dispatch:
  push:
    tags:
      - '*'

env:
  packageName: "net.bluwizard.hierarchy"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: get version
        id: version
        uses: notiz-dev/github-action-json-property@7c8cf5cc36eb85d8d287a8086a39dac59628eb31
        with:
          path: "package.json"
          prop_path: "version"

      - name: Verify tag matches package.json version
        if: github.ref_type == 'tag'
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${{ steps.version.outputs.prop }}"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Pushed tag '$TAG' does not match package.json version '$VERSION'."
            echo "::error::Bump package.json first, commit, then tag."
            exit 1
          fi
          echo "Tag and package.json version match: $VERSION"
      
      - name: Changelog Entry
        id: changelog
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.prop }}
          NOTES_PATH: ${{ runner.temp }}/release-notes.md
        run: |
          echo "notesPath=$NOTES_PATH" >> $GITHUB_OUTPUT

          if [ ! -f CHANGELOG.md ]; then
            echo "::warning::CHANGELOG.md not found. Falling back to auto-generated release notes."
            echo "found=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Grab everything between "# [<version>]" and the next "# [" heading,
          # then strip any leading blank lines.
          awk -v ver="$VERSION" '
            $0 == "# [" ver "]" { found = 1; next }
            found && /^# \[/    { exit }
            found               { print }
          ' CHANGELOG.md | sed -e '/./,$!d' > "$NOTES_PATH"

          if [ ! -s "$NOTES_PATH" ]; then
            echo "::warning::No CHANGELOG.md entry found for '# [$VERSION]'. Falling back to auto-generated release notes."
            echo "found=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "found=true" >> $GITHUB_OUTPUT
          echo "Release notes for $VERSION:"
          cat "$NOTES_PATH"

      - name: Set Environment Variables
        run: |
          echo "zipFile=${{ env.packageName }}-${{ steps.version.outputs.prop }}".zip >> $GITHUB_ENV
          echo "unityPackage=${{ env.packageName }}-${{ steps.version.outputs.prop }}.unitypackage" >> $GITHUB_ENV

      - run: find . -name "*.meta" >> .metaList

      - name: Create UnityPackage
        uses: pCYSl5EDgo/create-unitypackage@cfcd3cf0391a5ef1306342794866a9897c32af0b
        with:
          package-path: ${{ env.unityPackage }}
          include-files: .metaList

      - name: Create Zip
        shell: bash
        run: |
          zip -r "${{ env.zipFile }}" . \
            -x "${{ env.unityPackage }}" "${{ env.zipFile }}" \
              -x  ".git/*" ".git" "*/.github/*" \
                  ".github/*" ".github" "*/.github/*" \
                  ".gitignore" ".gitattributes" ".gitmodules"
      
      - name: Generate SHA256 Checksums
        id: checksums
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.prop }}
          NOTES_PATH: ${{ steps.changelog.outputs.notesPath }}
          NOTES_FOUND: ${{ steps.changelog.outputs.found }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # sha256sum-compatible manifest, shipped as a release asset.
          sha256sum "$zipFile" "$unityPackage" package.json > checksums.txt
          echo "SHA256 checksums:"
          cat checksums.txt

          # The checksum table gets appended to the release body, so the body has to
          # exist first. When there is no CHANGELOG entry, ask GitHub for the
          # auto-generated notes up front rather than letting the release action add
          # them afterwards, otherwise the checksums would land above them.
          letGitHubGenerate=false
          if [ "$NOTES_FOUND" != "true" ]; then
            if gh api --method POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
                 -f tag_name="$VERSION" --jq '.body' > "$NOTES_PATH"; then
              printf '\n' >> "$NOTES_PATH"
            else
              echo "::warning::Could not pre-generate release notes; they will be appended after the checksums."
              : > "$NOTES_PATH"
              letGitHubGenerate=true
            fi
          fi

          {
            echo ""
            echo "## SHA256 Checksums"
            echo ""
            echo "| File | SHA256 |"
            echo "| --- | --- |"
            while read -r hash name; do
              # sha256sum flags binary-mode entries with a leading "*"; keep it out of the table.
              printf '| `%s` | `%s` |\n' "${name#[*]}" "$hash"
            done < checksums.txt
            echo ""
            echo "Download \`checksums.txt\` into the same folder as the other assets and run \`sha256sum -c checksums.txt\` (macOS: \`shasum -a 256 -c checksums.txt\`) to verify them."
          } >> "$NOTES_PATH"

          echo "letGitHubGenerate=$letGitHubGenerate" >> $GITHUB_OUTPUT

      - name: Make Release
        uses: softprops/action-gh-release@1e07f4398721186383de40550babbdf2b84acfc5
        with:
          tag_name: ${{ steps.version.outputs.prop }}
          body_path: ${{ steps.changelog.outputs.notesPath }}
          generate_release_notes: ${{ steps.checksums.outputs.letGitHubGenerate == 'true' }}
          files: |
            ${{ env.zipFile }}
            ${{ env.unityPackage }}
            package.json

      - name: Trigger VPM Listing Rebuild
        env:
          GH_TOKEN: ${{ secrets.VPM_DISPATCH_TOKEN }}
        run: |
          gh workflow run build-listing.yml \
            --repo BluWizard10/VPM \
            --ref main
